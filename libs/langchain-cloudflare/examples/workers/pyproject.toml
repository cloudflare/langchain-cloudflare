[project]
name = "langchain-cloudflare-example"
version = "0.1.0"
description = "Example of using LangChain with Cloudflare Python Workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "webtypy>=0.1.7",
    "langchain-cloudflare>=0.3.5,<0.3.6",
    # Keep pywrangler sync on the latest Pyodide-compatible 0.3.x core.
    # scripts/setup_pyodide_deps.sh replaces this with LangChain 1.x wheels.
    "langchain-core>=0.3.81,<1.0.0",
    "sqlalchemy-cloudflare-d1>=0.3.1",
    # NOTE: Do NOT include pydantic - use Pyodide's built-in version
    # pydantic_core requires compiled Rust binaries that aren't available for WebAssembly
]

[dependency-groups]
dev = [
    # Pinned: pywrangler enforces a minimum uv version at runtime (1.16.x wants
    # uv >= 0.12.3) and hard-fails sync when it isn't met. Leaving this
    # unconstrained lets a routine resolve raise that floor with no warning.
    "workers-py>=1.16.4,<2",
    "workers-runtime-sdk",
    "pytest>=7.0.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
