[project]
name = "langgraph-checkpoint-cloudflare-d1-example"
version = "0.1.0"
description = "Example of using the Cloudflare D1 LangGraph checkpointer inside a Cloudflare Python Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "webtypy>=0.1.7",
    "langgraph-checkpoint-cloudflare-d1[worker]",
    # pywrangler ignores the [tool.uv.sources] local-path override below and
    # resolves langgraph-checkpoint-cloudflare-d1 from PyPI, where the
    # published version predates the [worker] extra -- so sqlalchemy-cloudflare-d1
    # is also listed directly here to make sure pywrangler actually installs it.
    "sqlalchemy-cloudflare-d1>=0.3.1",
    # Keep pywrangler sync on the latest Pyodide-compatible 0.3.x core.
    # scripts/setup_pyodide_deps.sh replaces this with LangChain/LangGraph 1.x wheels.
    "langchain-core>=0.3.81,<1.0.0",
    # NOTE: Do NOT include pydantic - use Pyodide's built-in version
    # pydantic_core requires compiled Rust binaries that aren't available for WebAssembly
]

[tool.uv.sources]
# Use the local checkout for testing - comment out for a standalone example.
langgraph-checkpoint-cloudflare-d1 = { path = "../..", editable = true }

[dependency-groups]
dev = [
    # Pinned: pywrangler enforces a minimum uv version at runtime (1.16.x
    # wants uv >= 0.12.3) and hard-fails sync when it is not met. Leaving
    # this unconstrained lets a routine resolve raise that floor silently.
    "workers-py>=1.16.4,<2",
    "workers-runtime-sdk",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
